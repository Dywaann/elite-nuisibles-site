[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aperçus (demandes de fusion et branches) : jamais indexés, sans suivi.
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "1"

[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "1"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
